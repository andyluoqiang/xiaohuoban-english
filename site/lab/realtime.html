<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 陪练 · 实时语音对话（原型）</title>
<style>
:root{--mint:#1ec9a0;--mint-d:#0fa583;--mint-l:#e6f9f3;--ink:#20303b;--sub:#6b7f8c;--bg:#f2faf7;--card:#ffffff;--sky:#e8f0fe;--azure:#1a5fb4;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,var(--mint) 0%,var(--mint-d) 100%);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(30,201,160,.25)}
header .logo{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:20px}
header h1{font-size:16px;margin:0;flex:1}
header h1 small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:2px}
#connDot{width:10px;height:10px;border-radius:50%;background:#ffd54a;box-shadow:0 0 8px #ffd54a;transition:.3s}
#connDot.on{background:#6cff2e;box-shadow:0 0 10px #6cff2e}
#connDot.off{background:#ff5252}
main{flex:1;overflow-y:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:86%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.me{align-self:flex-end;background:var(--mint);color:#fff;border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:var(--card);border:1px solid #d8efe7;border-bottom-left-radius:5px;box-shadow:0 2px 8px rgba(32,48,59,.05)}
.sys{align-self:center;background:var(--sky);color:#36506e;font-size:12px;border-radius:999px;padding:5px 14px}
.tip{align-self:center;color:var(--sub);font-size:12px;text-align:center;padding:0 20px}
#live{padding:2px 14px 8px}
#live .line{min-height:44px;background:var(--card);border:1px solid #d8efe7;border-radius:14px;padding:8px 14px;font-size:14px;color:var(--sub);display:flex;align-items:center;gap:8px}
footer{padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid #e2f2ec;display:flex;flex-direction:column;gap:10px}
#statusRow{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--sub);min-height:20px}
#statusRow .st{display:none;align-items:center;gap:6px}
#statusRow .st.show{display:flex}
#statusRow .dot{width:9px;height:9px;border-radius:50%;background:var(--mint);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
#waveRow{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:34px}
#waveRow i{width:5px;background:var(--mint);border-radius:3px;height:5px;transition:height .08s}
#btnRow{display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:16px;padding:15px 0;font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
#btnStart{background:linear-gradient(135deg,var(--mint),var(--mint-d));color:#fff;box-shadow:0 6px 18px rgba(30,201,160,.35)}
#btnStart:disabled{background:#bfe6db;box-shadow:none;cursor:not-allowed}
#btnHang{background:#ffe9e2;color:#d84a26;display:none}
#btnDemo{background:var(--sky);color:var(--azure);font-size:13px;padding:10px 0;flex:0 0 92px}
#btnStop{background:#fff1f0;color:#d84a26;border:1px solid #ffd7cd;display:none;flex:0 0 96px}
#err{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2f2f2f;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;display:none;max-width:88vw;z-index:9}
#codeMask{position:fixed;inset:0;background:rgba(10,30,25,.55);z-index:8;display:none;align-items:center;justify-content:center;padding:26px}
#codeMask.show{display:flex}
#codeDlg{width:100%;max-width:300px;background:#fff;border-radius:16px;padding:20px 18px 16px;box-shadow:0 18px 40px rgba(15,60,45,.3);animation:pop .2s ease}
#codeDlg h3{margin:0 0 6px;font-size:15.5px;text-align:center}
#codeDlg p{margin:0 0 10px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
#codeDlg input{width:100%;border:1.5px solid #cfe9e0;border-radius:12px;padding:11px 12px;font-size:14px;letter-spacing:1.5px;text-align:center;outline:none;box-sizing:border-box}
#codeDlg input:focus{border-color:var(--mint)}
#codeDlg .cs{display:flex;gap:8px;margin-top:12px}
#codeDlg button{flex:1;border:none;border-radius:12px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer}
#codeDlg .ok{background:linear-gradient(135deg,var(--mint),var(--mint-d));color:#fff}
#codeDlg .no{background:#eef5f2;color:var(--sub)}
</style>
</head>
<body>
<header>
  <div class="logo">🗣️</div>
  <h1>AI 陪练<small>Qwen-Omni-Realtime · WebRTC 全双工（原型）</small></h1>
  <div id="connDot"></div>
</header>
<main id="chat"></main>
<div id="live">
  <div class="line" id="liveLine"><span>💬</span><span id="liveText">点下方按钮开始，对着麦克风说英语（建议戴耳机）</span></div>
</div>
<footer>
  <div id="waveRow"></div>
  <div id="statusRow">
    <span class="st" id="stListen"><span class="dot"></span>聆听中，请说英语…</span>
    <span class="st" id="stThink">🧠 思考中…</span>
    <span class="st" id="stSpeak">🔊 老师正在说话（可随时插话打断）</span>
  </div>
  <div id="btnRow">
    <button class="btn" id="btnStart">🎤 开始对话</button>
    <button class="btn" id="btnDemo">▶ 演示模式</button>
    <button class="btn" id="btnStop">✋ 打断</button>
    <button class="btn" id="btnHang">📴 结束</button>
  </div>
</footer>
<div id="err"></div>
<div id="codeMask" onclick="if(event.target===this)this.classList.remove('show')">
  <div id="codeDlg">
    <h3>🔐 输入访问码</h3>
    <p>AI 陪练接口已启用访问码验证<br>请输入后重新点「开始对话」</p>
    <input id="codeIn" type="password" maxlength="32" autocomplete="off" placeholder="字母 / 数字">
    <div class="cs">
      <button class="no" onclick="document.getElementById('codeMask').classList.remove('show')">取消</button>
      <button class="ok" onclick="codeSubmit()">保存</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============ 配置 ============ */
const MODEL='qwen3.8-omni-flash-realtime';
const SDP_PROXY=(location.protocol==='https:'?'https:':'http:')+'//'+location.host+'/api/v1/webrtc/realtime?model='+MODEL;
const INSTRUCTIONS='You are a friendly American English teacher in a live voice call. Keep replies short and natural (1-3 spoken sentences), encourage the student, and gently correct grammar mistakes by rephrasing. Avoid long explanations unless asked.';
const $=id=>document.getElementById(id);

/* ============ 访问码门禁（与正式页共用 xb_aiCode 存储） ============ */
const AUTH_USER='luo';
function rtCode(){try{return JSON.parse(localStorage.getItem('xb_aiCode')||'""')||''}catch(e){return ''}}
function rtAuth(){const c=rtCode();try{return c?'Basic '+btoa(AUTH_USER+':'+c):''}catch(e){return ''}}
function askCode(wrong){$('codeMask').classList.add('show');if(wrong)bubble('sys','⚠️ 访问码不正确，请重新输入');setTimeout(()=>$('codeIn').focus(),60)}
function codeSubmit(){const v=($('codeIn').value||'').trim().replace(/[^\x21-\x7e]/g,'');if(!v){toast('请输入访问码');return}localStorage.setItem('xb_aiCode',JSON.stringify(v));$('codeMask').classList.remove('show');toast('访问码已保存，点「开始对话」继续')}

/* ============ 状态 ============ */
let pc=null, dc=null, micStream=null, remoteAudio=null;
let audioSender=null, micTrack=null, connected=false, speaking=false, gating=true;
let ac=null, analyser=null, rafId=0, demoDest=null, demoPlaying=false;
let aiText='', curAiBubble=null, curUserLine=null;

/* ============ 工具 ============ */
function toast(msg,ms=2800){const e=$('err');e.textContent=msg;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function bubble(cls,text){const d=document.createElement('div');d.className='bubble '+cls;d.textContent=text;$('chat').appendChild(d);scrollEnd();return d}
function scrollEnd(){requestAnimationFrame(()=>{const m=$('chat');m.scrollTop=m.scrollHeight})}
function setStatus(){['stListen','stThink','stSpeak'].forEach(i=>$(i).classList.remove('show'));
  if(connected&&speaking)$('stSpeak').classList.add('show');
  else if(connected&&!speaking)$('stListen').classList.add('show');}
function liveUpdate(icon,text){$('liveLine').innerHTML='<span>'+icon+'</span><span>'+text+'</span>'}
for(let i=0;i<24;i++)$('waveRow').appendChild(document.createElement('i'));
function meter(v){const bars=$('waveRow').children;for(let i=0;i<bars.length;i++){const h=4+Math.abs(Math.sin(Date.now()/180+i/2.4))*v*30*(0.4+Math.random()*.6);bars[i].style.height=Math.min(34,h)+'px'}}

/* ============ 音量分析 ============ */
function startMeter(stream){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const src=ac.createMediaStreamSource(stream);
  analyser=ac.createAnalyser();analyser.fftSize=512;
  src.connect(analyser);
  const data=new Uint8Array(analyser.frequencyBinCount);
  const pump=()=>{if(!analyser){return}
    analyser.getByteTimeDomainData(data);
    let peak=0;for(let i=0;i<data.length;i++){const v=Math.abs(data[i]-128)/128;if(v>peak)peak=v}
    meter(peak);rafId=requestAnimationFrame(pump)};
  pump();
}

/* ============ WebRTC 主流程 ============ */
async function startSession(){
  if(!rtCode()){askCode(false);return}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){toast('无法获取麦克风：'+e.name);bubble('sys','⚠️ 麦克风不可用（'+e.name+'），WebRTC 模式需要麦克风');return}

  pc=new RTCPeerConnection({iceServers:[]});
  pc.onconnectionstatechange=()=>{
    if(!pc)return;
    if(pc.connectionState==='connected'){
      $('connDot').className='on';bubble('sys','✅ WebRTC 已连通，等待会话就绪…');
    }else if(['failed','closed','disconnected'].includes(pc.connectionState)){
      endSession();bubble('sys','⚠️ 连接断开（'+pc.connectionState+'）');
    }
  };
  pc.ontrack=e=>{
    if(!remoteAudio){remoteAudio=document.createElement('audio');remoteAudio.autoplay=true;remoteAudio.hidden=true;document.body.appendChild(remoteAudio)}
    remoteAudio.srcObject=e.streams[0];
    remoteAudio.play().catch(()=>{});
    bubble('sys','🔊 已接收老师音频流');
  };
  pc.ondatachannel=ev=>bindChannel(ev.channel);
  dc=pc.createDataChannel('oai-events');
  bindChannel(dc);

  /* 添加麦克风轨 + 门控 */
  micTrack=micStream.getAudioTracks()[0];
  audioSender=pc.addTrack(micTrack,micStream);
  micTrack.enabled=false;
  await audioSender.replaceTrack(null); /* 彻底阻断，等 session.created 后恢复 */
  startMeter(micStream);

  /* Offer */
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise(res=>{
    if(pc.iceGatheringState==='complete')return res();
    pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete')res()};
    setTimeout(res,2500); /* 兜底：非 trickle 情况 */
  });
  const offerSdp=pc.localDescription.sdp;
  bubble('sys','📡 交换连接信息（SDP）…');

  /* SDP 经服务端代理换取 Answer（前端零密钥） */
  let ansSdp;
  try{
    const r=await fetch(SDP_PROXY,{method:'POST',headers:{'Content-Type':'application/sdp',Authorization:rtAuth()},body:offerSdp});
    if(r.status===401){localStorage.removeItem('xb_aiCode');askCode(true);endSession();return}
    if(!r.ok){const t=await r.text();throw new Error('HTTP '+r.status+' '+t.slice(0,120))}
    ansSdp=await r.text();
    window._dbg={offer:offerSdp,answer:ansSdp};
  }catch(e){toast('SDP 交换失败：'+e.message,4200);endSession();return}
  const fixed=ansSdp.replace(/\r\n/g,'\n').trim().split('\n').map(l=>l.trim()).filter(l=>l).join('\r\n')+'\r\n';
  await pc.setRemoteDescription({type:'answer',sdp:fixed});
}

function bindChannel(ch){
  ch.onopen=()=>{if(ch===dc)bubble('sys','🔗 控制通道已打开')};
  ch.onmessage=e=>handle(JSON.parse(e.data));
}

function handle(m){
  switch(m.type){
    case 'session.created':
      /* 解除门控 */
      gating=false;micTrack.enabled=true;
      audioSender.replaceTrack(micTrack).catch(()=>{});
      send({type:'session.update',session:{
        modalities:['text','audio'],
        voice:'Tina',
        instructions:INSTRUCTIONS,
        input_audio_format:'pcm',
        output_audio_format:'pcm',
        smooth_output:false,
        input_audio_transcription:{model:'qwen3-asr-flash-realtime'},
        turn_detection:{type:'semantic_vad',prefix_padding_ms:500,silence_duration_ms:900,threshold:0.1}
      }});
      break;
    case 'session.updated':
      connected=true;speaking=false;setStatus();
      bubble('sys','✅ 会话就绪，说英语吧！老师会自动接话，插话即打断');
      liveUpdate('🎤','聆听中…请说英语');
      break;
    case 'input_audio_buffer.speech_started':
      curUserLine=null;userLive='';
      liveUpdate('🎙️','正在听你说…');
      if(speaking)interrupt(true);
      break;
    case 'input_audio_buffer.speech_stopped':
      liveUpdate('🧠','收到！思考中…');
      break;
    case 'conversation.item.input_audio_transcription.delta':{
      const t=(m.text||'')+(m.stash||'');
      if(!curUserLine){curUserLine=document.createElement('div');curUserLine.className='bubble me';$('chat').appendChild(curUserLine)}
      curUserLine.textContent=t;scrollEnd();break}
    case 'conversation.item.input_audio_transcription.completed':
      if(curUserLine&&m.transcript)curUserLine.textContent=m.transcript;
      curUserLine=null;break;
    case 'response.created':
      aiText='';speaking=false;setStatus();break;
    case 'response.audio_transcript.delta':
      aiText+=m.delta||'';
      if(!curAiBubble)curAiBubble=bubble('ai','');
      curAiBubble.textContent=aiText;scrollEnd();break;
    case 'response.audio_transcript.done':
      if(curAiBubble&&m.transcript)curAiBubble.textContent=m.transcript;
      break;
    case 'response.output_audio_started':
      speaking=true;setStatus();break;
    case 'response.output_audio_done':
    case 'response.done':
      speaking=false;setStatus();
      if(aiText)liveUpdate('💬','老师说完啦，该你咯～');
      curAiBubble=null;break;
    case 'response.cancelled':
      speaking=false;setStatus();liveUpdate('✋','已打断，你说…');
      if(curAiBubble){curAiBubble.textContent=(aiText||'')+'（被打断）';curAiBubble=null}
      break;
    case 'error':
      toast('接口错误：'+(m.error&&m.error.message||JSON.stringify(m.error)).slice(0,120),4200);
      bubble('sys','⚠️ '+(m.error&&m.error.message||'error'));break;
  }
}

function send(obj){if(dc&&dc.readyState==='open')dc.send(JSON.stringify(obj))}

/* ============ 打断 ============ */
function interrupt(auto){
  send({type:'response.cancel'});
  if(remoteAudio){try{remoteAudio.pause();remoteAudio.currentTime=0;remoteAudio.play()}catch(e){}}
  speaking=false;setStatus();
  if(!auto)liveUpdate('✋','已打断，请说…');
}
$('btnStop').onclick=()=>interrupt(false);

/* ============ 演示模式：把测试语音注入上行 ============ */
async function demo(){
  if(!connected||!pc){toast('请先点「开始对话」并等会话就绪');return}
  if(demoPlaying)return;
  try{
    const r=await fetch('test_input.wav');const buf=await r.arrayBuffer();
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    const ab=await ac.decodeAudioData(buf);
    demoDest=ac.createMediaStreamDestination();
    const src=ac.createBufferSource();src.buffer=ab;src.connect(demoDest);
    const demoTrack=demoDest.stream.getAudioTracks()[0];
    await audioSender.replaceTrack(demoTrack);
    demoPlaying=true;
    bubble('me','Hello! I want to practice English conversation. Can you be my English teacher and talk with me?');
    bubble('sys','🎧 演示模式：播放 7.6 秒测试语音给老师听…');
    liveUpdate('🎧','演示语音播放中…');
    src.onended=async()=>{
      demoPlaying=false;
      await audioSender.replaceTrack(micTrack).catch(()=>{});
      bubble('sys','🎧 演示语音已播放完，等老师接话（VAD 自动断句）');
    };
    src.start();
  }catch(e){toast('演示失败：'+e.message)}
}
$('btnDemo').onclick=demo;

/* ============ 结束/清理 ============ */
function endSession(){
  connected=false;speaking=false;gating=true;setStatus();
  $('connDot').className='off';
  if(rafId)cancelAnimationFrame(rafId);rafId=0;analyser=null;
  if(ac){try{ac.close()}catch(e){}ac=null}
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
  if(pc){try{pc.close()}catch(e){}pc=null}
  dc=null;audioSender=null;micTrack=null;
  if(remoteAudio){try{remoteAudio.pause()}catch(e){}remoteAudio.srcObject=null}
  $('btnStart').style.display='block';
  $('btnHang').style.display='none';$('btnStop').style.display='none';
  meter(0);
}

/* ============ 按钮 ============ */
$('btnStart').onclick=async()=>{
  if(connected)return;
  $('btnStart').disabled=true;
  bubble('sys','正在建立 WebRTC 连接…');
  await startSession();
  $('btnStart').disabled=false;
  if(pc){$('btnStart').style.display='none';
    $('btnHang').style.display='block';$('btnStop').style.display='block'}
};
$('btnHang').onclick=()=>{endSession();bubble('sys','📴 已结束');liveUpdate('💬','点「开始对话」再来')};

bubble('tip','「AI 陪练」P1 原型（WebRTC 版）：点 🎤 实时对话；无麦克风环境点「演示模式」听全链路。密钥由服务端代理持有，本页面零密钥。');
</script>
</body>
</html>
